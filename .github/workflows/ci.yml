name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  check:
    name: Clippy + tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System deps
        run: sudo apt-get update -q && sudo apt-get install -y -q pkg-config libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x86-64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: System deps
        run: sudo apt-get update -q && sudo apt-get install -y -q pkg-config libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked -p shamelacraft
      - uses: actions/upload-artifact@v4
        with:
          name: shamelacraft-${{ matrix.arch }}
          path: target/release/shamelacraft

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
          - target: windows-x86_64
            runner: windows-2025
          - target: macos-aarch64
            runner: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: System deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q pkg-config libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked -p shamelacraft
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: tar -czf shamelacraft-${{ matrix.target }}.tar.gz -C target/release shamelacraft
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path target/release/shamelacraft.exe -DestinationPath shamelacraft-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: shamelacraft-${{ matrix.target }}.*

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: >
          gh release create "${{ github.ref_name }}" artifacts/*
          --title "${{ github.ref_name }}"
          --notes "ShamelaCraft ${{ github.ref_name }} — native builds for Linux (x86-64, ARM64), Windows (x86-64), macOS (ARM64). See README for install and book-download guides."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

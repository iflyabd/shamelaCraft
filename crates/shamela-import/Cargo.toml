[package]
name = "shamela-import"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Importers for ShamelaCraft: legacy .bok readers and archive.org downloads"

[dependencies]
shamela-content = { path = "../shamela-content" }
jetdb = "0.3"
ureq = "2"
serde_json = "1"
encoding_rs = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
rars = "0.10"
sevenz-rust = "0.6"
rusqlite = { version = "0.32", features = ["bundled"] }
